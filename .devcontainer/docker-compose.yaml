x-app-config: &app-env
  image: python:3.14.7
  working_dir: /workspace
  volumes:
    - ..:/workspace
  ports:
    - "8000:8000"
  post_start:
    - command: bash -c "source bexig/.env"
    - command: bash -c "pip install -r requirements.txt"

services:
  prod:
    <<: *app-env
    command: >-
      bash -c "python manage.py runserver 0.0.0.0:8000"
  
  dev:
    <<: *app-env
    command: tail -f /dev/null
    pre_stop:
      - command: bash -c "python -m pip freeze > requirements.txt"
